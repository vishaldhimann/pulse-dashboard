# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Azure App Service → Configuration → General settings → Startup command:
#   npm start
# (Do not use wwwroot/backend — this workflow deploys the backend folder as the site root.)

name: Build and deploy Node.js app to Azure Web App - backend-pulse-api

on:
  push:
    branches:
      - pulse-project
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Include SDK in backend (deploy is backend/ only; no ../sdk on App Service)
        run: |
          mkdir -p backend/public
          cp sdk/dist/pulse.min.js backend/public/pulse.min.js

      - name: npm ci, build, and test (backend)
        working-directory: backend
        run: |
          npm ci --omit=dev
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1ADD326F938C4F8EA13E833C90278973 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_02DD0DFD2E444F79930376F25A16B1DD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_266066E284FB4D19A4607BF5885717BB }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'backend-pulse-api'
          slot-name: 'Production'
          package: app
