# Deploy Node API + sdk/pulse.min.js to Azure App Service (Linux).
# Prereqs in Azure:
#   - Web App (Linux, Node 20), same resource group as Cosmos
#   - Configuration → Application settings: MONGODB_URI, (optional) AZURE_OPENAI_*
#   - General settings → Web sockets: On
#   - General settings → Startup command:
#       cd /home/site/wwwroot/backend && npm install --production && npm start
# GitHub repo secrets:
#   - AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND = contents of Download publish profile (.xml)
# GitHub repo variables (Settings → Secrets and variables → Actions → Variables):
#   - AZURE_WEBAPP_NAME_BACKEND = your Web App name (hostname without .azurewebsites.net)

name: Deploy backend (Azure App Service)

on:
  push:
    branches: [main, master, pulse-project]
    paths:
      - 'backend/**'
      - 'sdk/**'
      - '.github/workflows/azure-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_BACKEND }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BACKEND }}
          package: .
